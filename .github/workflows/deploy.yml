name: Deploy changes to Conginitecz

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual deployment"
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          ls -la
          ls -la dist || true

      # Optional: reset sync state while debugging
      - name: Reset FTP sync state
        run: rm -f .ftp-deploy-sync-state.json || true

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # or sftp
          port: 21 # or 22 for sftp
          server-dir: public_html/ # <-- set correctly, end with /
          local-dir: dist/ # <-- change if your framework outputs elsewhere
          log-level: verbose
          timeout: 120000
          # dangerous-clean-slate: true   # uncomment if you need remote deletions
